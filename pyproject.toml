[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "V2-fraud-detection"
version = "2.0.0"
description = "Projet de détection de la fraude sur les transactions bancaires"
readme = "README.md"
authors = [
    { name = "Daren Mabanza", email = "daren77186@icloud.com" }
]

dependencies = [
    "duckdb>=1.5.5",
    "fastparquet>=2026.5.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = []

[project.scripts]


[project.urls]

[tool.setuptools.packages.find]
where = ["03_src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
