[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "V2-fraud-detection"
version = "2.0.0"
description = "Projet de détection de la fraude sur les transactions bancaires"
requires-python = "==3.14.0"
readme = "README.md"
authors = [
    { name = "Daren Mabanza", email = "daren77186@icloud.com" }
]

dependencies = [
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.142.0",
    "fastparquet>=2026.5.0",
    "google-auth>=2.62.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "joblib>=1.6.0",
    "kaleido>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]


[project.urls]

[tool.setuptools.packages.find]
where = ["03_src"]
